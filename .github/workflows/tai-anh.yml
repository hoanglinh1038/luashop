# Tạm thời: tải ảnh ứng viên từ Unsplash vào nhánh "anh-ung-vien" để chọn ảnh sản phẩm. Xoá sau khi chọn xong.
name: Tai anh ung vien
on:
  push:
    branches: [main]
    paths: ['tools/photos.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tai anh
        run: |
          mkdir -p /tmp/pub/out
          while read -r label url size; do
            case "$label" in ''|'#'*) continue;; esac
            size=${size:-360}
            curl -sSL --fail -A "Mozilla/5.0" -o "/tmp/pub/out/${label}.jpg" "${url}?w=${size}&q=80&fm=jpg&fit=max" || echo "$label $url loi-tai" >> /tmp/pub/out/failed.txt
          done < tools/photos.txt
          ls /tmp/pub/out | wc -l
      - name: Day len nhanh anh-ung-vien
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout -q --orphan anh-ung-vien
          git rm -rf -q .
          cp -r /tmp/pub/. .
          git add -A
          git commit -q -m "Anh ung vien"
          git push -f -q origin anh-ung-vien
